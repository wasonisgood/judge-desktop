appId: tw.judge.research
productName: 司法院裁判研究
copyright: Copyright (c) wasonisgood
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - modules/**/*
asar: true
win:
  icon: app.ico
  target:
    - target: dir
      arch:
        - x64
# macOS 與 Linux 版：產出可直接安裝的格式（不含應用程式內自動更新）。
# 簽章與公證由建置環境決定（見 .github/workflows/release.yml）：
# 有 Developer ID 憑證與 Apple 公證帳號 → 簽章並公證；否則 ad-hoc 簽章（identity "-"，未公證）。
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
linux:
  category: Education
  icon: build/icon.png
  # deb、rpm 必填維護者（否則 electron-builder 會拒絕建置）。
  maintainer: "wasonisgood <wasonisgood@gmail.com>"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
# 檔名不含中文，便於在各發行版與下載工具中辨識：JudgeResearch-3.2.0-linux-x64.AppImage 等。
artifactName: "JudgeResearch-${version}-${os}-${arch}.${ext}"
