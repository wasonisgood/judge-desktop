<meta name="viewport" content="width=device-width, initial-scale=1">
<title>司法院裁判研究</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/features.css">

<body>
<div class="frame">
  <header class="titlebar">
    <div class="app-name">司法院裁判研究</div>
    <div class="spacer"></div>
    <label class="theme" title="深色模式">
      <span>深色</span>
      <input type="checkbox" id="themeToggle">
      <span class="switch"><span class="knob"></span></span>
    </label>
    <div class="win-controls">
      <button type="button" data-win="minimize" aria-label="最小化">－</button>
      <button type="button" data-win="toggleMaximize" aria-label="最大化">□</button>
      <button type="button" data-win="close" class="close" aria-label="關閉">×</button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" aria-label="主要功能">
      <button class="rail-item active" data-page="home"><span class="glyph">首</span><span class="label">首頁</span></button>
      <button class="rail-item" data-page="design"><span class="glyph">研</span><span class="label">研究設計</span></button>
      <button class="rail-item" data-page="list"><span class="glyph">列</span><span class="label">判決列表</span></button>
      <button class="rail-item" data-page="semantic"><span class="glyph">段</span><span class="label">段落檢索</span></button>
      <button class="rail-item" data-page="scope"><span class="glyph">範</span><span class="label">標編碼標注工序</span></button>
      <button class="rail-item" data-page="criteria"><span class="glyph">核</span><span class="label">納入排除</span></button>
      <button class="rail-item" data-page="brief"><span class="glyph">判</span><span class="label">單一判決精讀</span></button>
      <button class="rail-item" data-page="files"><span class="glyph">檔</span><span class="label">檔案</span></button>
      <button class="rail-item" data-page="tools"><span class="glyph">工</span><span class="label">工具</span></button>
      <button class="rail-item" data-page="settings"><span class="glyph">設</span><span class="label">設定</span></button>
    </nav>

    <main class="content">
      <div id="notice" class="notice" hidden></div>
      <div id="jobBanner" class="job-banner" role="status" hidden></div>

      <div id="pages"></div>





    </main>
  </div>
</div>

<!-- 懸浮 AI 助理 -->
<button class="assist-fab" id="assistFab" type="button" aria-label="開啟助理" aria-expanded="false" aria-controls="assistPanel">
  <span class="glyph">助</span>
</button>
<section class="assist-panel" id="assistPanel" hidden aria-label="助理">
  <header class="assist-head">
    <span class="assist-title">助理</span>
    <span class="spacer"></span>
    <select id="assistMode" class="ai-source" title="搜尋方式">
      <option value="ai">搜尋：AI 協助</option>
      <option value="traditional">搜尋：傳統（原文）</option>
    </select>
    <button class="btn small" type="button" id="assistFull" aria-pressed="false">全螢幕</button>
    <button class="btn small" type="button" id="assistClear">清除對話</button>
    <button class="btn small" type="button" id="assistClose" aria-label="收起">收起</button>
  </header>
  <div class="assist-log" id="assistLog" role="log" aria-live="polite"></div>
  <form class="assist-input" id="assistForm">
    <textarea id="assistText" rows="2" placeholder="例如：幫我找戒嚴時期補償的判決，並整理國家賠償法第2條" autocomplete="off"></textarea>
    <button class="btn primary" type="submit" id="assistSend">送出</button>
    <button class="btn" type="button" id="assistCancel" hidden>取消</button>
  </form>
  <p class="hint assist-hint">助理會先確認再執行會花費 AI 額度或改動資料的操作。</p>
</section>
