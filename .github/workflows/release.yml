name: 發版（安裝檔與更新清單）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: '完整發版（建置安裝器與 latest.json）'
        required: true
        default: release
        type: choice
        options:
          - release

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 建置共用核心
        working-directory: packages/core
        run: |
          npm ci
          npm run build

      - name: 快取 Electron 執行檔
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-38-${{ runner.os }}

      - name: 建置應用程式
        working-directory: apps/desktop
        shell: bash
        run: |
          for i in 1 2 3; do npm ci && break; echo "npm ci 第 $i 次失敗，稍後重試"; sleep 30; done
          npm run build

      - name: 打包應用程式（資料夾版，供安裝器使用）
        working-directory: apps/desktop
        run: npx electron-builder --win --dir --publish never

      - name: 產生安裝器與更新程式（C# 原生視窗）
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File apps/desktop/installer/build_installer.ps1 -RebuildPayload

      - name: 產生更新清單 latest.json
        working-directory: apps/desktop
        run: node installer/generate_manifest.js

      - name: 檢查安裝器完整性
        shell: bash
        run: |
          f="apps/desktop/JudgeResearchSetup.exe"
          test -f "$f" || { echo "找不到安裝器"; exit 1; }
          if grep -a -q "Nullsoft" "$f"; then echo "安裝器含有 NSIS 特徵，不符合規格"; exit 1; fi
          if ! grep -a -q "BSJB" "$f"; then echo "安裝器缺少 .NET 執行環境標頭"; exit 1; fi
          size=$(stat -c%s "$f")
          if [ "$size" -lt 50000000 ]; then echo "安裝器過小（$size bytes），內容可能不完整"; exit 1; fi
          echo "安裝器檢查通過（$size bytes）"

      - name: 讀取版本號
        id: ver
        shell: bash
        run: |
          v=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: 建立 Release 並上傳檔案
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 司法院裁判研究 v${{ steps.ver.outputs.version }}
          files: |
            apps/desktop/JudgeResearchSetup.exe
            apps/desktop/installer/publish/latest.json
          generate_release_notes: true
          draft: false
          prerelease: false
